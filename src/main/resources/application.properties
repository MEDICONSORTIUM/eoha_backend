spring.application.name=eoha_backend
spring.config.import=optional:file:.env.local[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eoha}?sslmode=${DB_SSLMODE:require}}
spring.datasource.username=${DB_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.initialization-fail-timeout=-1

spring.sql.init.mode=never

server.port=${PORT:8080}
