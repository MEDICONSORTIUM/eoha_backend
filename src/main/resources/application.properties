spring.application.name=eoha_backend

# Local dev: if a .env file exists at the project root it is loaded here and its
# spring.datasource.* keys win. Absent (CI / deployed), the DB_* environment
# variables below are used instead.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway manages the schema (indexes, future DDL). The application tables already
# exist in RDS, so the first run baselines the existing schema then applies V1+.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.port=8080

# Dashboard / info endpoint metadata
eoha.name=EOHA Backend
eoha.version=0.0.1-SNAPSHOT

# Comma-separated list of browser origins allowed to call /api/**. Override in
# production via the CORS_ALLOWED_ORIGINS environment variable.
eoha.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
